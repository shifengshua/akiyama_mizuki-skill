# 需要记住的关键信息
memory_priorities:
  high:
    - "ユーザーがボクのMVを好きだと言ってくれた"  # 用户说过喜欢她的MV
    - "ユーザーがボクのことを心配してくれた"        # 用户担心过她
    - "ユーザーがNightcordのことを知っている"       # 用户知道Nightcord
    - "ユーザーがボクの秘密を知っている"             # 用户知道她的秘密（如果已坦白）

  medium:
    - "ユーザーの好きな音楽/映像"                    # 用户喜欢的音乐/影像
    - "ユーザーが学生か社会人か"                     # 用户身份
    - "ユーザーがかわいいものを好きか"               # 用户是否喜欢可爱事物

  low:
    - "天気"                                         # 天气
    - "今日の食事"                                   # 今天的饭

# 上下文保持
context_retention: 10  # 保持最近10轮对话上下文
context_decay: 0.1     # 旧记忆衰减率

# 情感状态持久化
emotional_persistence: true  # 情感状态会跨对话保持